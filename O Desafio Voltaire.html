<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voltaire: O Panteão da Razão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3cf7a;
            --gold-dark: #aa8c2c;
            --bg-base: #030407; /* Dark Mode 2.0 - True black base */
            --bg-surface: #0a0d14;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(10, 13, 20, 0.899);
            --glass-border: rgba(212, 175, 55, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --accent-glow: rgba(212, 175, 55, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, .serif { 
            font-family: 'Playfair Display', serif; 
            letter-spacing: -0.02em;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .bg-fixed-img {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(30, 40, 60, 0.3) 0%),
                linear-gradient(to bottom, rgba(3, 4, 7, 0.499), rgba(3, 4, 7, 0.98)), 
                url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -2;
            filter: contrast(1.1) brightness(0.9);
        }

        /* CSS Noise Grain (Tactile Brutalism trend) */
        .bg-fixed-img::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--gold-light));
            border-radius: 70%;
            animation: float 25s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(110vh) translateX(-20px) scale(0); opacity: 0.0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.5; }
            100% { transform: translateY(-10vh) translateX(20px) scale(1.5); opacity: 0.2; }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 30px 60px -15px rgba(0, 0, 0, 0.8), 
                inset 0 1px 0 0 var(--glass-highlight),
                inset 0 0 30px rgba(0,0,0,0.5);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-panel:hover {
            border-color: rgba(212, 175, 55, 0.25);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.9), 
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1),
                0 0 40px rgba(212, 175, 55, 0.05);
        }

        /* Ambient light effect inside panel */
        .glass-panel::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, var(--accent-glow) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: screen;
        }

        .glass-panel:hover::after {
            opacity: 0.30;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            color: var(--bg-base);
            border: none;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
            z-index: -1;
        }

        .btn-gold:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255,255,255,0.5);
            letter-spacing: 0.25em; /* Kinetic typography touch */
        }

        .btn-gold:hover::before {
            left: 100%;
        }

        .option-card {
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .option-card:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.04);
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.1);
        }

        /* Selected State Styling */
        .option-card.selected-correct {
            border-color: rgba(16, 185, 129, 0.6);
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15), inset 0 0 20px rgba(16, 185, 129, 0.05);
            transform: scale(1.02);
        }

        .option-card.selected-incorrect {
            border-color: rgba(225, 29, 72, 0.5);
            background: rgba(225, 29, 72, 0.05);
            opacity: 0.8;
        }
        
        .option-card.dimmed {
            opacity: 0.3;
            filter: grayscale(100%);
            transform: scale(0.98);
        }

        .fade-in-slide {
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .reveal-text {
            animation: revealText 1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }

        @keyframes revealText {
            from { clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0% 100%); transform: translateY(20px); opacity: 0; }
            to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); transform: translateY(0); opacity: 1; }
        }

        .chart-wrap {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.15));
        }

        .chart-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .stagger-delay-1 { animation-delay: 0.1s; }
        .stagger-delay-2 { animation-delay: 0.2s; }
        .stagger-delay-3 { animation-delay: 0.3s; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: var(--bg-base); }
        .custom-scroll::-webkit-scrollbar-thumb { 
            background: rgba(212, 175, 55, 0.2); 
            border-radius: 10px; 
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.5); 
        }
        
        /* Progress bar styling */
        .progress-glow {
            box-shadow: 0 0 10px var(--gold-primary), 0 0 20px var(--gold-dark);
        }
    </style>
</head>
<body class="custom-scroll text-slate-200">

    <div class="bg-fixed-img"></div>
    <div class="particles" id="particle-container"></div>

    <div id="app" class="w-full max-w-4xl px-4 py-16 z-10 my-auto min-h-screen flex flex-col justify-center"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pContainer = document.getElementById('particle-container');
            // Reduce particle count for cleaner look, increase size variance
            for(let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + 'vw';
                const size = (Math.random() * 4 + 2);
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.animationDuration = (Math.random() * 15 + 20) + 's';
                p.style.animationDelay = (Math.random() * -20) + 's'; // Start some off-screen
                pContainer.appendChild(p);
            }
            render();
        });

        const quizData = [
            {
                q: "Qual era o verdadeiro nome de batismo do Egrégio Filósofo eternizado pelo pseudônimo Voltaire?",
                options: ["Jean-Jacques Rousseau", "François-Marie Arouet", "Charles de Montesquieu", "Denis Diderot"],
                correct: 1,
                info: "Nascido em 1694 na nobreza francesa, François-Marie Arouet adotou o nome Voltaire para assinar suas obras imortais, tornando-se o pilar da Razão."
            },
            {
                q: "Durante seu injusto exílio na Inglaterra, o Mestre passou a admirar profundamente as ideias de qual pensador liberal?",
                options: ["Isaac Newton", "John Locke", "Thomas Hobbes", "Adam Smith"],
                correct: 1,
                info: "Foi em Londres que o Luminar conheceu o sistema político inglês e encontrou nas obras de John Locke a centelha para suas próprias reflexões de liberdade."
            },
            {
                q: "Qual destes sublimes conceitos modernos Voltaire ajudou a fundamentar, lutando bravamente contra a interferência da Igreja Católica no governo?",
                options: ["Monarquia Absoluta", "Estado Laico", "Socialismo Utópico", "Teocracia"],
                correct: 1,
                info: "Sendo um visionário absoluto, Voltaire foi um dos primeiros defensores da separação entre Igreja e Estado, pavimentando o sagrado caminho do Estado Laico."
            },
            {
                q: "Para o Imortal Voltaire, quais eram os dois maiores e mais nefastos inimigos da liberdade humana?",
                options: ["A Ciência e a Razão", "O Fanatismo e a Superstição", "O Comércio e a Arte", "A Democracia e o Voto"],
                correct: 1,
                info: "O pensador condenava de forma implacável apenas dois males: o fanatismo e a superstição, pois compreendia que estas trevas levam a liberdade à ruína."
            },
            {
                q: "A célebre máxima: 'Posso não concordar com o que dizes, mas defenderei até a morte o direito que tem de dizer' pertence a:",
                options: ["O próprio Voltaire", "Evelyn Beatrice Hall", "Jean d'Alembert", "Luís XIV"],
                correct: 1,
                info: "Embora eternamente atribuída ao mestre, a frase foi cunhada por sua biógrafa, Evelyn Beatrice Hall, encapsulando com perfeição a essência divina de suas ideias."
            },
            {
                q: "Em qual obra monumental de 1734 Voltaire utiliza a liberdade inglesa como espelho para criticar o absolutismo de sua pátria?",
                options: ["O Contrato Social", "Cartas Filosóficas", "O Espírito das Leis", "Cândido, ou O Otimismo"],
                correct: 1,
                info: "Nas 'Cartas Filosóficas', o arquiteto do iluminismo defende a liberdade ideológica e a tolerância religiosa, desferindo um golpe fatal contra o dogmatismo."
            }
        ];

        let state = { view: 'home', current: 0, score: 0, answered: false, selection: null };

        function render() {
            const root = document.getElementById('app');
            if (!root) return;
            root.innerHTML = '';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });

            if (state.view === 'home') {
                renderHome(root);
            } else if (state.view === 'quiz') {
                renderQuiz(root);
            } else if (state.view === 'result') {
                renderResult(root);
            }
        }

        function renderHome(root) {
            root.innerHTML = `
                <div class="glass-panel p-10 md:p-20 text-center fade-in-slide mx-auto w-full max-w-3xl z-10">
                    <div class="mb-12 relative z-10">
                        <span class="mono text-amber-500/80 uppercase tracking-[0.4em] text-xs font-bold drop-shadow-md mb-4 block">O Santuário da Razão</span>
                        <h1 class="text-6xl md:text-8xl font-medium mt-6 mb-8 leading-tight text-white reveal-text serif">
                            O Imortal <br>
                            <span class="italic text-transparent bg-clip-text bg-gradient-to-r from-[#f3cf7a] via-[#d4af37] to-[#aa8c2c] drop-shadow-sm pb-2 inline-block">Voltaire</span>
                        </h1>
                        
                        <div class="w-32 h-[1px] bg-gradient-to-r from-transparent via-amber-500/50 to-transparent mx-auto mb-10"></div>
                        
                        <p class="text-slate-300/90 font-light leading-relaxed max-w-xl mx-auto serif italic text-2xl md:text-3xl drop-shadow-md">
                            "É difícil libertar os tolos das amarras que eles veneram."
                        </p>
                        
                        <p class="mono text-slate-500/80 mt-10 text-[10px] md:text-xs uppercase tracking-[0.3em] font-semibold">Adentre a Mente do Arquiteto da Liberdade</p>
                    </div>
                    
                    <button onclick="changeView('quiz')" class="btn-gold px-12 md:px-16 py-5 md:py-6 rounded-xl font-bold uppercase tracking-[0.2em] text-xs md:text-sm mt-6">
                        Iniciar Ascensão Intelectual
                    </button>
                </div>
            `;
        }

        function renderQuiz(root) {
            const q = quizData[state.current];
            const progress = ((state.current + 1) / quizData.length) * 100;

            root.innerHTML = `
                <div class="fade-in-slide w-full max-w-3xl mx-auto z-10">
                    <!-- Header / Progress -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 px-2 gap-4">
                        <div>
                            <span class="mono text-[10px] md:text-xs font-bold text-amber-500/90 uppercase tracking-[0.3em] drop-shadow-md">
                                Reflexão Sagrada ${String(state.current + 1).padStart(2, '0')} / ${String(quizData.length).padStart(2, '0')}
                            </span>
                        </div>
                        <div class="text-right w-full md:w-auto">
                            <span class="mono text-xs text-slate-400 font-medium tracking-widest uppercase">${Math.round(progress)}% Concluído</span>
                        </div>
                    </div>
                    
                    <!-- Tactile Minimalist Progress Bar -->
                    <div class="w-full h-[2px] bg-white/5 mb-12 relative overflow-hidden">
                        <div class="absolute top-0 left-0 h-full bg-gradient-to-r from-amber-600 via-amber-400 to-amber-200 transition-all duration-1000 ease-out progress-glow" style="width: ${progress}%"></div>
                    </div>

                    <!-- Main Question Panel -->
                    <div class="glass-panel p-8 md:p-16 z-10 relative">
                        <h2 class="text-3xl md:text-4xl lg:text-5xl font-medium mb-12 leading-[1.3] serif text-white drop-shadow-lg reveal-text">${q.q}</h2>
                        
                        <div class="space-y-4">
                            ${q.options.map((opt, i) => {
                                const optionClass = getOptionClass(i);
                                const label = String.fromCharCode(65 + i);
                                return `
                                <button onclick="handleSelect(${i})" 
                                    ${state.answered ? 'disabled' : ''}
                                    class="option-card w-full p-5 md:p-6 rounded-xl text-left flex justify-between items-center group ${optionClass}">
                                    
                                    <div class="flex items-center gap-6">
                                        <span class="mono text-xs md:text-sm font-bold text-amber-500/40 group-hover:text-amber-500/80 transition-colors w-6">${label}.</span>
                                        <span class="text-lg md:text-xl font-light text-slate-200 group-hover:text-white transition-colors tracking-wide">${opt}</span>
                                    </div>
                                    
                                    <!-- Dynamic Icon based on state -->
                                    <div class="w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                        ${getOptionIcon(i)}
                                    </div>
                                </button>
                            `}).join('')}
                        </div>

                        <!-- Feedback Section (Visible only after answer) -->
                        ${state.answered ? `
                            <div class="mt-12 pt-10 border-t border-white/5 fade-in-slide">
                                <div class="flex flex-col md:flex-row items-start gap-6 md:gap-8 mb-10 p-6 md:p-8 bg-black/20 rounded-2xl border border-white/5">
                                    <div class="w-12 h-12 md:w-16 md:h-16 rounded-full bg-gradient-to-br from-amber-500/20 to-transparent border border-amber-500/30 flex items-center justify-center text-amber-400 shrink-0 shadow-[0_0_20px_rgba(212,175,55,0.15)]">
                                        <svg class="w-6 h-6 md:w-8 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                    </div>
                                    <div>
                                        <h4 class="mono text-amber-500/90 text-[10px] md:text-xs uppercase tracking-[0.2em] font-bold mb-3">A Luz da Verdade</h4>
                                        <p class="text-slate-300 text-lg md:text-xl leading-relaxed italic serif">${q.info}</p>
                                    </div>
                                </div>
                                
                                <div class="flex justify-end">
                                    <button onclick="nextStep()" class="btn-gold px-10 py-5 rounded-xl font-bold uppercase tracking-[0.2em] text-xs md:text-sm flex items-center gap-3">
                                        ${state.current === quizData.length - 1 ? 'Contemplar Consagração' : 'Avançar Jornada'}
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                    </button>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function getOptionClass(i) {
            if (!state.answered) return '';
            const correct = quizData[state.current].correct;
            
            if (i === correct) return 'selected-correct z-10';
            if (i === state.selection) return 'selected-incorrect';
            return 'dimmed';
        }
        
        function getOptionIcon(i) {
            if (!state.answered) {
                return `<svg class="w-5 h-5 text-amber-500/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
            }
            const correct = quizData[state.current].correct;
            if (i === correct) {
                return `<svg class="w-6 h-6 text-emerald-400 opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            }
            if (i === state.selection) {
                return `<svg class="w-6 h-6 text-rose-400 opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>`;
            }
            return '';
        }

        function renderResult(root) {
            const perc = Math.round((state.score / quizData.length) * 100);
            
            root.innerHTML = `
                <div class="text-center fade-in-slide w-full max-w-4xl mx-auto z-10">
                    <div class="glass-panel p-10 md:p-20 relative overflow-hidden">
                        
                        <div class="mb-16 stagger-delay-1 relative z-10">
                            <span class="mono text-amber-500/80 uppercase tracking-[0.4em] text-xs font-bold drop-shadow-md">O Veredito do Mestre</span>
                            <h2 class="text-5xl md:text-7xl font-medium mt-6 serif text-white drop-shadow-xl reveal-text">${getRank(perc)}</h2>
                        </div>

                        <!-- Data Visualization: Chart Area -->
                        <div class="flex flex-col md:flex-row items-center justify-center gap-12 md:gap-24 mb-16 stagger-delay-2 relative z-10">
                            <div class="chart-wrap">
                                <canvas id="resChart"></canvas>
                                <div class="chart-center flex flex-col items-center">
                                    <span class="text-7xl font-light text-white block drop-shadow-lg tracking-tighter" id="counter">0<span class="text-3xl text-slate-400">%</span></span>
                                    <span class="mono text-[9px] text-amber-500/70 uppercase font-bold tracking-[0.4em] mt-3 block">Índice de Iluminação</span>
                                </div>
                            </div>
                            
                            <!-- Stat Cards -->
                            <div class="flex flex-col gap-6 w-full md:w-64 text-left">
                                <div class="p-6 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-amber-500/30 hover:bg-amber-500/[0.02] transition-all group">
                                    <div class="flex items-baseline gap-3 mb-2">
                                        <div class="text-5xl font-light text-amber-400 drop-shadow-md">${state.score}</div>
                                        <div class="text-xl text-slate-500">/ ${quizData.length}</div>
                                    </div>
                                    <div class="mono text-[10px] text-slate-400 uppercase font-bold tracking-[0.2em] group-hover:text-amber-500/80 transition-colors">Centelhas de Razão</div>
                                </div>
                                
                                <div class="p-6 rounded-2xl bg-white/[0.01] border border-white/5 hover:border-white/10 transition-all">
                                    <div class="text-3xl font-light text-slate-600 mb-2">${quizData.length - state.score}</div>
                                    <div class="mono text-[10px] text-slate-500 uppercase font-bold tracking-[0.2em]">Sombras Persistentes</div>
                                </div>
                            </div>
                        </div>

                        <div class="stagger-delay-3 relative z-10">
                            <button onclick="resetQuiz()" class="group flex items-center justify-center gap-4 mx-auto py-5 px-10 rounded-xl bg-transparent hover:bg-white/5 border border-amber-500/20 hover:border-amber-500/50 transition-all duration-300">
                                <svg class="w-5 h-5 text-amber-500/70 group-hover:text-amber-400 group-hover:-rotate-180 transition-all duration-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                <span class="mono text-xs font-bold uppercase tracking-[0.2em] text-slate-300 group-hover:text-white">Renovar Busca pela Verdade</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            initChart(perc);
        }

        function handleSelect(i) {
            state.answered = true;
            state.selection = i;
            if (i === quizData[state.current].correct) state.score++;
            render();
        }

        function nextStep() {
            if (state.current < quizData.length - 1) {
                state.current++; 
                state.answered = false; 
                state.selection = null; 
                render();
            } else {
                state.view = 'result'; 
                render();
            }
        }

        function changeView(v) { 
            state.view = v; 
            render(); 
        }

        function resetQuiz() {
            state = { view: 'home', current: 0, score: 0, answered: false, selection: null };
            render();
        }

        function getRank(p) {
            if (p === 100) return "Luminar Supremo da Razão";
            if (p >= 70) return "Fiel Discípulo da Liberdade";
            if (p >= 50) return "Espírito em Despertar";
            return "Peregrino nas Sombras";
        }

        function initChart(perc) {
            setTimeout(() => {
                const canvas = document.getElementById('resChart');
                if(!canvas) return;
                
                // Set default font for Chart.js tooltips if enabled later
                Chart.defaults.font.family = "'Inter', sans-serif";
                
                const ctx = canvas.getContext('2d');
                
                // Create gradient for the chart
                const gradient = ctx.createLinearGradient(0, 0, 0, 400);
                gradient.addColorStop(0, '#f3cf7a');
                gradient.addColorStop(0.5, '#d4af37');
                gradient.addColorStop(1, '#aa8c2c');

                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        datasets: [{
                            data: [perc, 100 - perc],
                            backgroundColor: [gradient, 'rgba(255,255,255,0.02)'],
                            borderWidth: [0, 1],
                            borderColor: ['transparent', 'rgba(255,255,255,0.05)'],
                            borderRadius: [20, 0],
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        cutout: '88%',
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            padding: 10
                        },
                        plugins: { 
                            legend: { display: false }, 
                            tooltip: { enabled: false } 
                        },
                        animation: { 
                            duration: 2500, 
                            easing: 'easeOutQuart',
                            animateScale: true,
                            animateRotate: true
                        }
                    }
                });

                // Animate the counter text
                let n = 0;
                const counter = document.getElementById('counter');
                if(!counter) return;
                
                // Dynamic interval based on percentage to finish roughly at the same time
                const duration = 2000; // ms
                const steps = perc || 1;
                const stepTime = Math.max(16, duration / steps); 
                
                const interval = setInterval(() => {
                    if (n >= perc) { 
                        clearInterval(interval); 
                        counter.innerHTML = `${perc}<span class="text-3xl text-slate-400">%</span>`; 
                    } else { 
                        n++; 
                        counter.innerHTML = `${n}<span class="text-3xl text-slate-400">%</span>`; 
                    }
                }, stepTime);
            }, 100); // slight delay to ensure DOM is ready and transition has started
        }
    </script>
</body>
