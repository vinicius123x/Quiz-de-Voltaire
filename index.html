<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Voltaire - Mestre da Tolerância</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --parchment: #fdfbf7;
            --ink: #1e293b;
            --accent: #4f46e5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--ink);
            overflow-x: hidden;
        }

        h1, h2, .serif {
            font-family: 'Libre+Baskerville', serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .transition-all-custom {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:hover {
            transform: translateX(8px);
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 300px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade {
            animation: fadeIn 0.6s ease-out forwards;
        }

        /* Progress Bar */
        .progress-bar-inner {
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Chosen Palette: Enlightenment Parchment (Warm Neutrals & Indigo) -->
    <!-- Application Structure Plan: 
        1. Landing: Apresentação de Voltaire e contexto histórico.
        2. Quiz Engine: Fluxo de 6 perguntas com imagens decorativas e justificativas pedagógicas extraídas do texto.
        3. Results: Visualização de desempenho usando Chart.js para feedback quantitativo e citação final para impacto qualitativo.
        O design foca na legibilidade e no "flow" do usuário, removendo distrações e focando no conteúdo do documento fonte.
    -->
    <!-- Visualization & Content Choices: 
        - Report Info -> Biografia e Pensamento de Voltaire.
        - Goal -> Testar retenção e ensinar conceitos (Estado Laico, Tolerância).
        - Viz -> Chart.js Donut para o score final (Canvas).
        - Interaction -> Seleção de resposta, botões de navegação, reinício.
        - Justification -> A interatividade mantém o usuário engajado no texto técnico.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <div id="app" class="w-full max-w-2xl mx-auto">
        <!-- O conteúdo será injetado pelo JavaScript -->
    </div>

    <script>
        const quizData = [
            {
                question: "Qual era o verdadeiro nome do pensador iluminista que usava o pseudônimo Voltaire?",
                options: ["Jean-Jacques Rousseau", "François-Marie Arouet", "Charles-Louis de Secondat", "Isaac Newton"],
                correct: 1,
                reason: "Voltaire era o apelido de François-Marie Arouet, nascido em Paris em 1694.",
                img: "https://images.unsplash.com/photo-1580619305218-8423a7ef79b4?auto=format&fit=crop&q=80&w=800"
            },
            {
                question: "Durante seu exílio entre 1726 e 1728, qual país Voltaire passou a admirar por sua liberdade de expressão?",
                options: ["Alemanha", "Holanda", "Suíça", "Inglaterra"],
                correct: 3,
                reason: "Em Londres, Voltaire passou a admirar o sistema político inglês e as ideias de John Locke, onde o poder do rei era limitado.",
                img: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&q=80&w=800"
            },
            {
                question: "Voltaire foi um dos primeiros defensores de qual conceito que propõe a separação entre Igreja e Estado?",
                options: ["Monarquia Absolutista", "Estado Laico", "Direito Divino", "Teocracia"],
                correct: 1,
                reason: "Ele acreditava que o ser humano deveria ser livre de interferências religiosas no governo, defendendo o Estado Laico.",
                img: "https://images.unsplash.com/photo-1548013146-72479768bbaa?auto=format&fit=crop&q=80&w=800"
            },
            {
                question: "Segundo o documento, quais eram os dois únicos tipos de pensamento que Voltaire condenava e lutava contra?",
                options: ["A razão e a ciência", "O comércio e a burguesia", "O fanatismo e a superstição", "A democracia e a liberdade"],
                correct: 2,
                reason: "Para Voltaire, o fanatismo e a superstição são perigosos porque levam a liberdade à ruína.",
                img: "https://images.unsplash.com/photo-1519074063236-43098367094b?auto=format&fit=crop&q=80&w=800"
            },
            {
                question: "Sobre a famosa frase 'Posso não concordar com o que dizes, mas defenderei até a morte o direito que tem de dizer', o que é verdade?",
                options: ["Foi escrita por Voltaire em 'Cartas Persas'", "Foi dita por ele durante a Revolução Francesa", "É de autoria de sua biógrafa, Evelyn Beatrice Hall", "Foi uma citação direta de Isaac Newton"],
                correct: 2,
                reason: "Embora resuma suas ideias, a autoria é de sua biógrafa. Voltaire nunca a escreveu literalmente.",
                img: "https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&q=80&w=800"
            },
            {
                question: "Em qual obra de 1734 Voltaire defende a tolerância religiosa e combate o fanatismo dogmático?",
                options: ["Do Contrato Social", "O Espírito das Leis", "Cartas Filosóficas", "Enciclopédia"],
                correct: 2,
                reason: "Publicada após seu retorno da Inglaterra, 'Cartas Filosóficas' é um marco da defesa das liberdades ideológicas.",
                img: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?auto=format&fit=crop&q=80&w=800"
            }
        ];

        let currentState = {
            view: 'landing',
            currentQuestion: 0,
            score: 0,
            answered: false,
            selectedOption: null
        };

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (currentState.view === 'landing') {
                app.innerHTML = `
                    <div class="glass-card rounded-3xl shadow-2xl overflow-hidden animate-fade">
                        <div class="h-64 bg-slate-200 relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1560174038-da43ac74f01b?auto=format&fit=crop&q=80&w=1000" class="w-full h-full object-cover opacity-80" alt="Voltaire">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 to-transparent flex items-end p-8">
                                <h1 class="text-white text-4xl font-bold">O Iluminista da Liberdade</h1>
                            </div>
                        </div>
                        <div class="p-8">
                            <p class="text-lg text-slate-600 mb-6 leading-relaxed">
                                Explore a mente de <strong>Voltaire</strong>, o defensor ferrenho da tolerância e da liberdade de expressão. Este desafio testa seus conhecimentos com base nos fatos históricos do período iluminista.
                            </p>
                            <div class="bg-indigo-50 border-l-4 border-indigo-500 p-4 mb-8 italic text-indigo-800">
                                "O preconceito é uma opinião não submetida a razão."
                            </div>
                            <button onclick="startQuiz()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg transition-all-custom transform hover:scale-[1.02]">
                                Iniciar Desafio
                            </button>
                        </div>
                    </div>
                `;
            } else if (currentState.view === 'quiz') {
                const q = quizData[currentState.currentQuestion];
                const progress = ((currentState.currentQuestion + 1) / quizData.length) * 100;

                app.innerHTML = `
                    <div class="animate-fade">
                        <div class="mb-6">
                            <div class="flex justify-between items-end mb-2">
                                <span class="text-sm font-semibold text-indigo-600 uppercase tracking-wider">Questão ${currentState.currentQuestion + 1} de ${quizData.length}</span>
                                <span class="text-xs text-slate-400">Progresso: ${Math.round(progress)}%</span>
                            </div>
                            <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
                                <div class="progress-bar-inner h-full bg-indigo-500" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="glass-card rounded-3xl shadow-xl overflow-hidden">
                            <div class="h-48 overflow-hidden">
                                <img src="${q.img}" class="w-full h-full object-cover" alt="Contexto">
                            </div>
                            <div class="p-8">
                                <h2 class="text-2xl font-bold mb-8 leading-tight text-slate-800">${q.question}</h2>
                                <div class="space-y-3">
                                    ${q.options.map((opt, i) => `
                                        <button onclick="handleAnswer(${i})" 
                                            ${currentState.answered ? 'disabled' : ''}
                                            class="option-btn w-full p-4 text-left rounded-xl border-2 transition-all-custom flex justify-between items-center
                                            ${getOptionClass(i)}">
                                            <span class="font-medium">${opt}</span>
                                            <span class="indicator font-bold">${getOptionIndicator(i)}</span>
                                        </button>
                                    `).join('')}
                                </div>

                                ${currentState.answered ? `
                                    <div class="mt-8 p-5 bg-slate-50 rounded-2xl border border-slate-100 animate-fade">
                                        <h4 class="text-xs font-bold text-slate-400 uppercase mb-2">Por que?</h4>
                                        <p class="text-slate-700 text-sm leading-relaxed">${q.reason}</p>
                                        <button onclick="nextQuestion()" class="mt-6 w-full py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition-all">
                                            ${currentState.currentQuestion === quizData.length - 1 ? 'Ver Resultado Final' : 'Próxima Pergunta'}
                                        </button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentState.view === 'results') {
                const percentage = Math.round((currentState.score / quizData.length) * 100);
                app.innerHTML = `
                    <div class="glass-card rounded-3xl shadow-2xl p-10 text-center animate-fade">
                        <h2 class="text-3xl font-bold mb-2">Missão Cumprida!</h2>
                        <p class="text-slate-500 mb-8">Seu desempenho no pensamento de Voltaire</p>
                        
                        <div class="chart-container mb-8">
                            <canvas id="scoreChart"></canvas>
                        </div>

                        <div class="mb-10">
                            <div class="text-5xl font-black text-indigo-600 mb-2">${currentState.score} / ${quizData.length}</div>
                            <p class="text-slate-600 font-medium">${getResultMessage(percentage)}</p>
                        </div>

                        <div class="bg-indigo-50 rounded-2xl p-6 mb-8 italic text-indigo-900 text-sm">
                            "A primeira lei da natureza é a tolerância; já que temos todos uma porção de erros e fraquezas."
                        </div>

                        <button onclick="restart()" class="flex items-center justify-center gap-2 mx-auto px-8 py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-2xl font-bold transition-all">
                             Tentar Novamente
                        </button>
                    </div>
                `;
                initChart();
            }
        }

        function getOptionClass(index) {
            if (!currentState.answered) return 'border-slate-100 hover:border-indigo-300 hover:bg-indigo-50 text-slate-700';
            const q = quizData[currentState.currentQuestion];
            if (index === q.correct) return 'border-emerald-500 bg-emerald-50 text-emerald-800';
            if (index === currentState.selectedOption) return 'border-rose-500 bg-rose-50 text-rose-800';
            return 'border-slate-50 opacity-40 text-slate-400';
        }

        function getOptionIndicator(index) {
            if (!currentState.answered) return '•';
            const q = quizData[currentState.currentQuestion];
            if (index === q.correct) return '✓';
            if (index === currentState.selectedOption) return '✕';
            return '';
        }

        function getResultMessage(pct) {
            if (pct === 100) return "Excelente! Você é um verdadeiro iluminista.";
            if (pct >= 70) return "Muito bom! Você compreende bem a tolerância.";
            if (pct >= 50) return "Bom progresso, mas ainda há sombras a dissipar.";
            return "Continue estudando! A razão o libertará.";
        }

        function startQuiz() {
            currentState.view = 'quiz';
            currentState.currentQuestion = 0;
            currentState.score = 0;
            render();
        }

        function handleAnswer(index) {
            if (currentState.answered) return;
            currentState.answered = true;
            currentState.selectedOption = index;
            if (index === quizData[currentState.currentQuestion].correct) {
                currentState.score++;
            }
            render();
        }

        function nextQuestion() {
            if (currentState.currentQuestion < quizData.length - 1) {
                currentState.currentQuestion++;
                currentState.answered = false;
                currentState.selectedOption = null;
                render();
            } else {
                currentState.view = 'results';
                render();
            }
        }

        function restart() {
            currentState.view = 'landing';
            currentState.answered = false;
            currentState.selectedOption = null;
            render();
        }

        function initChart() {
            setTimeout(() => {
                const ctx = document.getElementById('scoreChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Corretas', 'Incorretas'],
                        datasets: [{
                            data: [currentState.score, quizData.length - currentState.score],
                            backgroundColor: ['#10b981', '#e2e8f0'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '80%',
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });
            }, 50);
        }

        // Inicialização
        render();
    </script>
</body>
</html>
